[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claps-conformal"
version = "0.1.0"
description = "CLAPS: aleatoric-epistemic scaling via last-layer Laplace for conformal regression"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
experiments = [
  "pandas>=2.0",
  "torch>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "ipython>=8.0",
  "requests>=2.30",
  "openpyxl>=3.1",
  "xlrd>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
